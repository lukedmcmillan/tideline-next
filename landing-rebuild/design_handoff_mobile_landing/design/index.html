<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Tideline · Mobile Landing</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400..800;1,400..800&family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #ECE9E1;
    font-family: 'DM Sans', -apple-system, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    color: #0B1628;
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 24px 12px;
  }
  /* The visual frame: 390px iPhone-class container with soft device-ish chrome.
     We do NOT use a heavy bezel here — the brief is a clean editorial mobile design. */
  .device {
    width: 390px;
    background: #FAFAF7;
    border-radius: 32px;
    overflow: hidden;
    box-shadow: 0 1px 0 rgba(11,22,40,0.04), 0 24px 60px rgba(11,22,40,0.18);
    position: relative;
  }
  /* Status bar mock to ground it as a phone */
  .status-bar {
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    background: #FAFAF7;
    font-family: -apple-system, system-ui, sans-serif;
    font-weight: 600;
    font-size: 14px;
    color: #0B1628;
    position: relative;
    z-index: 100;
  }
  .status-bar .icons { display: flex; align-items: center; gap: 5px; }
  .scroll {
    height: 844px;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: thin;
  }
  .scroll::-webkit-scrollbar { width: 4px; }
  .scroll::-webkit-scrollbar-thumb { background: #C5BFB2; border-radius: 4px; }
  /* Home indicator */
  .home-indicator {
    position: absolute;
    bottom: 6px; left: 50%; transform: translateX(-50%);
    width: 134px; height: 5px; border-radius: 100px;
    background: rgba(11,22,40,0.35);
    z-index: 100;
  }
  @keyframes tdl-pulse {
    0%, 100% { opacity: 0.45; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.2); }
  }
  @keyframes tdl-slide-down {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  /* superscript for citations */
  sup { vertical-align: super; line-height: 0; }
  ::selection { background: rgba(29,158,117,0.22); }

  /* Caption beside frame */
  .caption {
    position: absolute;
    top: 24px; right: 24px;
    font-family: 'DM Sans', sans-serif;
    font-size: 11px; color: #6B7A8C;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    text-align: right;
    line-height: 1.6;
  }
  @media (max-width: 540px) {
    body { padding: 0; background: #FAFAF7; align-items: stretch; }
    .device { width: 100vw; height: 100vh; border-radius: 0; box-shadow: none; }
    .scroll { height: calc(100vh - 36px); }
    .home-indicator { display: none; }
    .caption { display: none; }
  }
</style>
</head>
<body>

<div class="caption">
  Mobile landing<br/>
  390 × 844<br/>
  iPhone Pro
</div>

<div class="device">
  <div class="status-bar">
    <span>9:41</span>
    <span class="icons">
      <svg width="17" height="11" viewBox="0 0 17 11" fill="none"><rect x="0.5" y="3" width="3" height="6" rx="0.5" fill="#0B1628"/><rect x="5" y="2" width="3" height="7" rx="0.5" fill="#0B1628"/><rect x="9.5" y="1" width="3" height="8" rx="0.5" fill="#0B1628"/><rect x="14" y="0" width="3" height="9" rx="0.5" fill="#0B1628"/></svg>
      <svg width="15" height="11" viewBox="0 0 15 11" fill="none"><path d="M7.5 9.5C9.43 9.5 11.18 8.7 12.45 7.43L7.5 2.5L2.55 7.43C3.82 8.7 5.57 9.5 7.5 9.5Z" fill="#0B1628"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="2.5" stroke="#0B1628" fillOpacity="0.4"/><rect x="2" y="2" width="18" height="8" rx="1.5" fill="#0B1628"/><rect x="22.5" y="4" width="1.5" height="4" rx="0.5" fill="#0B1628" opacity="0.4"/></svg>
    </span>
  </div>
  <div class="scroll" id="scroll-root">
    <div id="root"></div>
  </div>
  <div class="home-indicator"></div>
</div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="Header.jsx"></script>
<script type="text/babel" src="Hero.jsx"></script>
<script type="text/babel" src="PulseCard.jsx"></script>
<script type="text/babel" src="Sections.jsx"></script>
<script type="text/babel" src="Footer.jsx"></script>
<script type="text/babel" src="App.jsx"></script>
<script type="text/babel">
  // Patch sticky-header behaviour: scroll listener should bind to .scroll, not window.
  // We hot-fix it by re-running the effect against the right scroll container.
  (function ensureStickyScroll() {
    const root = document.getElementById('root');
    const scroller = document.getElementById('scroll-root');
    // Re-render once react mounts; observe the scroller.
    const obs = new MutationObserver(() => {
      const header = root.querySelector('header');
      if (!header) return;
      // Make header position sticky inside its scroll parent (already is).
      // Replace its scroll listener: simulate via scroller scroll events.
      scroller.addEventListener('scroll', () => {
        if (scroller.scrollTop > 12) {
          header.style.borderBottomColor = '#E5E1D8';
        } else {
          header.style.borderBottomColor = 'transparent';
        }
      });
      obs.disconnect();
    });
    obs.observe(root, { childList: true, subtree: true });
  })();

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
